AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Hooligans Loyalty App - Serverless Backend

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    MemorySize: 512
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        POINTS_TABLE: !Ref PointsTable
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        ORDERS_TABLE: !Ref OrdersTable
        LOCATIONS_TABLE: !Ref LocationsTable
        JWT_SECRET: !Ref JWTSecret

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  
  JWTSecret:
    Type: String
    NoEcho: true
    Description: Secret key for JWT tokens

Resources:
  # ========== API Gateway ==========
  HooligansApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub hooligans-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: LambdaTokenAuthorizer
        Authorizers:
          LambdaTokenAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn

  # ========== Lambda Functions ==========
  
  # Authorizer
  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/auth/
      Handler: authorizer.handler

  # Auth Functions
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/auth/
      Handler: login.handler
      Events:
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/auth/
      Handler: register.handler
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /auth/register
            Method: POST
            Auth:
              Authorizer: NONE

  # User Functions
  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/
      Handler: getProfile.handler
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /user/profile
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/users/
      Handler: updateProfile.handler
      Events:
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /user/profile
            Method: PUT
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # Points Functions
  ScanQRFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/points/
      Handler: scanQR.handler
      Events:
        ScanQR:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /points/scan-qr
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PointsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable

  RedeemPointsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/points/
      Handler: redeemPoints.handler
      Events:
        RedeemPoints:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /points/redeem
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PointsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransactionsTable

  # Order Functions
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/orders/
      Handler: createOrder.handler
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /orders/create
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  GetOrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/orders/
      Handler: getOrders.handler
      Events:
        GetOrders:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /orders/history
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable

  # Location Functions
  GetLocationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/locations/
      Handler: getAll.handler
      Events:
        GetLocations:
          Type: Api
          Properties:
            RestApiId: !Ref HooligansApi
            Path: /locations
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LocationsTable

  # ========== DynamoDB Tables ==========
  
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hooligans-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  PointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hooligans-points-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: pointsId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: pointsId
          KeyType: RANGE

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hooligans-transactions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transactionId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: transactionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-timestamp-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: locationId-timestamp-index
          KeySchema:
            - AttributeName: locationId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hooligans-orders-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  LocationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hooligans-locations-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: locationId
          AttributeType: S
      KeySchema:
        - AttributeName: locationId
          KeyType: HASH

  # ========== S3 Buckets ==========
  
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hooligans-images-${Environment}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            MaxAge: 3600

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${HooligansApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable
    Export:
      Name: !Sub ${AWS::StackName}-UsersTable

  ImagesBucketName:
    Description: S3 Images Bucket Name
    Value: !Ref ImagesBucket
    Export:
      Name: !Sub ${AWS::StackName}-ImagesBucket
